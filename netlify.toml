[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.15.0"
  # Vinext provides the Next-compatible API; Nitro owns the Netlify adapter.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[headers]]
  for = "/*"

  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
