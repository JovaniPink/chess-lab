[build]
  command = "corepack npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"
  NPM_VERSION = "12.0.2"
  # Vinext provides the Next-compatible API; Nitro owns the Netlify adapter.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[dev]
  command = "corepack npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "https://chess-labs.netlify.app/*"
  to = "https://chess.measuredstudios.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; media-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# Prerendered metadata files need explicit MIME types at the Netlify edge.
[[headers]]
  for = "/icon0"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/icon1"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

  [redirects.rate_limit]
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]
