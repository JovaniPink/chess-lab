name: Next.js baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "49 20 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Next.js baseline v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JovaniPink/nextjs-typescript-boilerplate/baseline/v1@e8a000d6dda19c41eb4fe96463ca6df780f8dd9e
        with:
          check-latest: ${{ github.event_name == 'schedule' }}
